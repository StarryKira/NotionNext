name: Docker ghcr.io

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [main]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTION_PAGE_ID has to be present at *build* time: the Dockerfile runs
      # `yarn build`, which pre-renders every page from Notion. When it is
      # missing the build silently falls back to the upstream demo page in
      # blog.config.js and ships an image with the wrong content.
      - name: Verify build inputs
        if: github.event_name != 'pull_request'
        env:
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID || secrets.NOTION_PAGE_ID }}
        run: |
          if [ -z "$NOTION_PAGE_ID" ]; then
            echo "::error::NOTION_PAGE_ID is not set. Add it under Settings -> Secrets and variables -> Actions, otherwise the image is built from the upstream demo Notion page."
            exit 1
          fi

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Consumed by the ARG/ENV pair in the Dockerfile's builder stage.
          # NEXT_PUBLIC_* in particular must exist here, not just at runtime,
          # because Next.js inlines it into the client bundle during the build.
          build-args: |
            NOTION_PAGE_ID=${{ vars.NOTION_PAGE_ID || secrets.NOTION_PAGE_ID }}
            NEXT_PUBLIC_THEME=${{ vars.NEXT_PUBLIC_THEME || secrets.NEXT_PUBLIC_THEME }}
